[package]
name = "wujud-firmware"
description = "wujud ESP32 firmware: room mode (router -> board CSI) and hall node mode (ESP-NOW mesh)"
version = "0.1.0"
edition = "2021"
license = "TBD"

[lib]
path = "src/lib.rs"

[[bin]]
name = "wujud-firmware"
path = "src/main.rs"

[features]
default = ["room"]
room = []
hall-node = []

[dependencies]
wujud-proto = { path = "../crates/proto", default-features = false }

[target.'cfg(target_os = "espidf")'.dependencies]
esp-idf-svc = "0.53"
log = "0.4"
anyhow = "1"

[target.'cfg(target_os = "espidf")'.build-dependencies]
embuild = "0.33"

[dev-dependencies]
ndarray = "0.16"
ndarray-npy = { version = "0.9", default-features = false, features = ["compressed_npz"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"

[package.metadata.esp-idf-sys]
esp_idf_sdkconfig_defaults = ["sdkconfig.defaults"]
