<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HallSense 3D</title>
<style>
:root{--bg:#0b0f17;--panel:rgba(16,22,34,.78);--line:rgba(255,255,255,.10);--ink:#eef2f8;--ink2:#a9b3c4;--muted:#6f7a8c;
--cyan:#4fb3ff;--orange:#ff8a4c;--green:#42d392;--warn:#f2b84b}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
#c{position:fixed;inset:0;display:block}
.hud{position:fixed;top:16px;left:16px;width:min(340px,calc(100vw - 32px));background:var(--panel);border:1px solid var(--line);
border-radius:14px;padding:16px 18px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.top{display:flex;align-items:center;gap:8px}
h1{font-size:15px;margin:0;font-weight:650;letter-spacing:.2px}
.badge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;border:1px solid currentColor;letter-spacing:.4px}
.SIMULATION{color:var(--warn)} .LIVE{color:var(--green)} .REPLAY{color:var(--ink2)}
.label{color:var(--ink2);font-size:13px;margin-top:12px}
.big{font-size:72px;font-weight:750;line-height:1;letter-spacing:-2px;font-variant-numeric:tabular-nums;margin-top:4px}
.state{font-size:34px;font-weight:700;line-height:1.1;margin-top:6px}
.sub{color:var(--ink2);font-size:14px;margin-top:6px}
.row{display:flex;justify-content:space-between;margin-top:8px;font-size:13px;color:var(--ink2)}
.row b{color:var(--ink);font-variant-numeric:tabular-nums}
canvas#spark{width:100%;height:70px;margin-top:10px;display:block}
.legend{position:fixed;left:16px;bottom:14px;display:flex;gap:14px;flex-wrap:wrap;color:var(--ink2);font-size:12px;background:var(--panel);
border:1px solid var(--line);border-radius:10px;padding:8px 12px;max-width:calc(100vw - 32px)}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.tools{position:fixed;right:16px;top:16px;display:flex;gap:8px}
button{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:7px 11px;font:inherit;font-size:13px;cursor:pointer}
button[aria-pressed="true"]{border-color:var(--cyan);color:var(--cyan)}
.breath{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--green);margin-right:6px;vertical-align:0}
@media (max-width:640px){.big{font-size:54px}.state{font-size:26px}.tools{top:auto;bottom:64px}}
</style>
<script type="importmap">{"imports":{"three":"./vendor/three.module.min.js"}}</script>
</head>
<body>
<canvas id="c"></canvas>
<section class="hud" aria-live="polite">
  <div class="top"><h1>HallSense</h1><span id="mode" class="badge">…</span></div>
  <div id="hallBox">
    <div class="label">Students detected</div>
    <div class="big" id="count">–</div>
    <div class="sub" id="cap"></div>
    <div class="row" id="truthRow" hidden><span>Ground truth (simulation)</span><b id="truth">–</b></div>
  </div>
  <div id="roomBox" hidden>
    <div class="label">State</div>
    <div class="state" id="state">–</div>
    <div class="sub" id="pose"></div>
    <div class="sub" id="breath"></div>
    <div class="row"><span>Position</span><b id="pos">–</b></div>
    <div class="row" id="rtruthRow" hidden><span>Ground truth (simulation)</span><b id="rtruth">–</b></div>
  </div>
  <div class="row"><span>Links reporting</span><b id="alive">–</b></div>
  <canvas id="spark" aria-label="history"></canvas>
</section>
<div class="tools">
  <button id="bTruth" aria-pressed="true">Truth</button>
  <button id="bSpin" aria-pressed="true">Rotate</button>
</div>
<div class="legend" id="legend">
  <span><i class="sw" style="background:#ff8a4c"></i>ESP32 node</span>
  <span><i class="sw" style="background:#4fb3ff"></i>detected person</span>
  <span><i class="sw" style="background:#e9eef6;opacity:.6"></i>ground truth (sim)</span>
  <span><i class="sw" style="background:linear-gradient(90deg,#1e2a3d,#4fb3ff)"></i>link activity</span>
</div>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "./vendor/OrbitControls.js";

const $ = id => document.getElementById(id);
const canvas = $("c");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio));
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0f17);
scene.fog = new THREE.Fog(0x0b0f17, 30, 70);
const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 200);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true; controls.autoRotate = true; controls.autoRotateSpeed = 0.6;
scene.add(new THREE.HemisphereLight(0xbfd4ff, 0x10141c, 0.9));
const sun = new THREE.DirectionalLight(0xffffff, 0.8); sun.position.set(8, 14, 6); scene.add(sun);

let world = null, key = "", spin = true, showTruth = true;
const COL = { seat0: new THREE.Color(0x1e2a3d), seat1: new THREE.Color(0x4fb3ff), node: 0xff8a4c, router: 0xffffff,
              person: 0x4fb3ff, ghost: 0xe9eef6, wall: 0x8aa0c0, link0: new THREE.Color(0x1e2a3d), link1: new THREE.Color(0x4fb3ff) };
// sim coords: x right, y depth, z up  ->  three: (x, z, y)
const V = (p) => new THREE.Vector3(p[0], p[2], p[1]);

function resize() { const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); }
addEventListener("resize", resize); resize();

function box(w, h, d, color, opacity = 1) {
  const m = new THREE.MeshStandardMaterial({ color, roughness: 0.85, metalness: 0.05, transparent: opacity < 1, opacity });
  return new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m);
}

function build(s) {
  if (world) { scene.remove(world.root); }
  const sc = s.scene, root = new THREE.Group(); scene.add(root);
  const W = sc.W, D = sc.D, H = sc.H;
  // floor (tiered steps for amphitheatres)
  const floorMat = new THREE.MeshStandardMaterial({ color: 0x151c28, roughness: 1 });
  const t = sc.tiers;
  if (t && t.rise > 0) {
    const nrow = Math.ceil((D - t.y0) / t.pitch) + 1;
    for (let r = 0; r < nrow; r++) {
      const y0 = Math.max(0, t.y0 + (r - 0.5) * t.pitch), y1 = Math.min(D, t.y0 + (r + 0.5) * t.pitch);
      if (y1 <= y0) continue;
      const hgt = Math.max(0.02, r * t.rise);
      const st = new THREE.Mesh(new THREE.BoxGeometry(W, hgt, y1 - y0), floorMat);
      st.position.set(W / 2, hgt / 2, (y0 + y1) / 2); root.add(st);
      const e = new THREE.LineSegments(new THREE.EdgesGeometry(st.geometry), new THREE.LineBasicMaterial({ color: 0x2a3550 }));
      e.position.copy(st.position); root.add(e);
    }
    const fr = new THREE.Mesh(new THREE.BoxGeometry(W, 0.02, t.y0 - t.pitch / 2), floorMat);
    fr.position.set(W / 2, 0.01, (t.y0 - t.pitch / 2) / 2); root.add(fr);
  } else {
    const fl = new THREE.Mesh(new THREE.BoxGeometry(W, 0.02, D), floorMat); fl.position.set(W / 2, 0.01, D / 2); root.add(fl);
  }
  const grid = new THREE.GridHelper(Math.max(W, D) * 3, Math.round(Math.max(W, D) * 3), 0x1b2433, 0x131a26);
  grid.position.set(W / 2, -0.01, D / 2); root.add(grid);
  // glass walls
  const wallH = H;
  const edges = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(W, wallH, D)),
    new THREE.LineBasicMaterial({ color: 0x3b4a66, transparent: true, opacity: 0.8 }));
  edges.position.set(W / 2, wallH / 2, D / 2); root.add(edges);
  const glass = new THREE.MeshStandardMaterial({ color: COL.wall, transparent: true, opacity: 0.05, side: THREE.DoubleSide, depthWrite: false });
  [[W, wallH, 0.01, W / 2, D], [0.01, wallH, D, 0, D / 2], [0.01, wallH, D, W, D / 2]].forEach(([w, h, d, x, z]) => {
    const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), glass); m.position.set(x, h / 2, z); root.add(m);
  });
  // board / front marker
  if (sc.kind === "hall") {
    const bd = box(Math.min(6, W * 0.5), 1.4, 0.05, 0x2b3a55); bd.position.set(W / 2, 1.8, 0.03); root.add(bd);
  }
  // furniture
  (sc.furniture || []).forEach(f => {
    const c = { bed: 0x34405a, desk: 0x3a3226, wardrobe: 0x2e2a35 }[f.kind] || 0x333a47;
    const m = box(f.w, f.h, f.d, c); m.position.set(f.x, f.z + f.h / 2, f.y); root.add(m);
  });
  // seats (instanced)
  let seats = null;
  if (sc.seats && sc.seats.length) {
    seats = new THREE.InstancedMesh(new THREE.BoxGeometry(0.44, 0.08, 0.40), new THREE.MeshStandardMaterial({ roughness: 0.6 }), sc.seats.length);
    const m4 = new THREE.Matrix4();
    sc.seats.forEach((p, i) => { m4.makeTranslation(p[0], p[2] + 0.45, p[1]); seats.setMatrixAt(i, m4); seats.setColorAt(i, COL.seat0); });
    root.add(seats);
  }
  // people: detected (cyan) and truth ghosts, one instance per seat (hall) or a single avatar (room)
  const cap = new THREE.CapsuleGeometry(0.17, 0.55, 4, 10);
  const pMat = new THREE.MeshStandardMaterial({ color: COL.person, emissive: 0x1a5fa8, emissiveIntensity: 0.6, roughness: 0.4, transparent: true, opacity: 0.95 });
  const gMat = new THREE.MeshBasicMaterial({ color: COL.ghost, wireframe: true, transparent: true, opacity: 0.25 });
  let det = null, ghost = null;
  if (sc.kind === "hall") {
    det = new THREE.InstancedMesh(cap, pMat, sc.seats.length); det.count = 0; root.add(det);
    ghost = new THREE.InstancedMesh(cap, gMat, sc.seats.length); ghost.count = 0; root.add(ghost);
  }
  const avatar = new THREE.Mesh(new THREE.CapsuleGeometry(0.2, 1.2, 6, 14), pMat.clone()); avatar.visible = false; root.add(avatar);
  const avGhost = new THREE.Mesh(new THREE.CapsuleGeometry(0.2, 1.2, 4, 10), gMat); avGhost.visible = false; root.add(avGhost);
  const ring = new THREE.Mesh(new THREE.RingGeometry(0.35, 0.42, 48), new THREE.MeshBasicMaterial({ color: 0x42d392, transparent: true, opacity: 0.0, side: THREE.DoubleSide }));
  ring.rotation.x = -Math.PI / 2; root.add(ring);
  // nodes
  const nodeObjs = sc.nodes.map((p, i) => {
    const isR = sc.node_roles && sc.node_roles[i] === "router";
    const m = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.10, 0.16), new THREE.MeshStandardMaterial({ color: isR ? COL.router : COL.node, emissive: isR ? 0x666666 : 0x7a2e10, emissiveIntensity: 0.9 }));
    m.position.copy(V(p)); root.add(m); return m;
  });
  // links + travelling pulses
  const links = sc.links.map(([i, j]) => {
    const g = new THREE.BufferGeometry().setFromPoints([V(sc.nodes[i]), V(sc.nodes[j])]);
    const l = new THREE.Line(g, new THREE.LineBasicMaterial({ color: COL.link0.clone(), transparent: true, opacity: 0.35, blending: THREE.AdditiveBlending, depthWrite: false }));
    root.add(l);
    const dot = new THREE.Mesh(new THREE.SphereGeometry(0.045, 8, 8), new THREE.MeshBasicMaterial({ color: 0x9fd8ff, transparent: true, opacity: 0 }));
    root.add(dot);
    return { l, dot, a: V(sc.nodes[i]), b: V(sc.nodes[j]), phase: Math.random(), act: 0 };
  });
  // camera framing
  const span = Math.max(W, D);
  camera.position.set(W * 0.5 + span * 0.75, span * 0.75, D + span * 0.55);
  controls.target.set(W / 2, 0.8, D / 2); controls.update();
  world = { root, sc, seats, det, ghost, avatar, avGhost, ring, links, nodeObjs, bpm: null, pose: null };
}

const tmpM = new THREE.Matrix4(), tmpC = new THREE.Color();
function update(s) {
  const sc = s.scene;
  const k = sc.kind + sc.W.toFixed(2) + sc.D.toFixed(2) + sc.nodes.length + (sc.seats ? sc.seats.length : 0);
  if (k !== key) { build(s); key = k; }
  $("mode").textContent = s.mode; $("mode").className = "badge " + s.mode;
  $("alive").textContent = `${s.alive ?? "–"} / ${sc.links.length}`;
  (s.link_activity || []).forEach((a, i) => { if (world.links[i]) world.links[i].act = a; });
  if (sc.kind === "hall") {
    $("hallBox").hidden = false; $("roomBox").hidden = true;
    const h = s.hall || {};
    $("count").textContent = h.count != null ? Math.round(h.count) : "…";
    $("cap").textContent = h.count != null ? `${Math.round(100 * h.count / sc.seats.length)}% of ${sc.seats.length} seats` : "collecting evidence…";
    $("truthRow").hidden = h.true_count == null; if (h.true_count != null) $("truth").textContent = h.true_count;
    if (h.p) {
      // place detected students on the most likely seats, as many as the estimated count
      const order = h.p.map((v, i) => [v, i]).sort((a, b) => b[0] - a[0]);
      const n = Math.max(0, Math.min(order.length, Math.round(h.count || 0)));
      world.det.count = n;
      for (let r = 0; r < n; r++) { const p = sc.seats[order[r][1]]; tmpM.makeTranslation(p[0], p[2] + 0.95, p[1]); world.det.setMatrixAt(r, tmpM); }
      world.det.instanceMatrix.needsUpdate = true;
      h.p.forEach((v, i) => { tmpC.copy(COL.seat0).lerp(COL.seat1, Math.min(1, v)); world.seats.setColorAt(i, tmpC); });
      world.seats.instanceColor.needsUpdate = true;
    }
    if (h.truth && showTruth) {
      let n = 0; h.truth.forEach((v, i) => { if (v) { const p = sc.seats[i]; tmpM.makeTranslation(p[0], p[2] + 0.95, p[1]); world.ghost.setMatrixAt(n++, tmpM); } });
      world.ghost.count = n; world.ghost.instanceMatrix.needsUpdate = true;
    } else world.ghost.count = 0;
    spark(s.history, sc.seats.length);
  } else {
    $("hallBox").hidden = true; $("roomBox").hidden = false;
    const r = s.room || {};
    const names = { away: "Nobody home", empty: "Empty room", lie: "Lying down", sit: "Sitting", stand: "Standing", walk: "Moving", still: "Someone here, still", moving: "Moving", quiet: "No motion (calibrate to tell empty from still)" };
    $("state").textContent = names[r.state3] || names[r.state] || "…";
    $("pose").textContent = (r.state3 === "still" && r.state !== "still") ? `pose guess: ${names[r.state].toLowerCase()} (low confidence)` : "";
    $("breath").innerHTML = r.breath_bpm ? `<span class="breath"></span>Breathing ${Math.round(r.breath_bpm)} / min` : (r.state3 === "still" ? "breathing: waiting for 25 s of stillness / not visible from this link" : "");
    $("rtruthRow").hidden = !r.truth; if (r.truth) $("rtruth").textContent = (names[r.truth] || r.truth) + (r.truth_bpm ? ` · ${Math.round(r.truth_bpm)}/min` : "");
    world.bpm = r.breath_bpm || null;
    $("pos").textContent = r.xy ? `${r.xy[0].toFixed(1)}, ${r.xy[1].toFixed(1)} m` : "off (needs calibration)";
    const av = world.avatar;
    av.visible = !!r.state3 && r.state3 !== "empty" && r.state3 !== "quiet";
    const xy = r.xy || [sc.W / 2, sc.D / 2];
    world.pose = r.state3 === "still" ? "still" : r.state;
    if (world.pose === "lie") { av.rotation.set(0, 0, Math.PI / 2); av.position.set(xy[0], 0.75, xy[1]); }
    else if (world.pose === "sit" || world.pose === "still") { av.rotation.set(0, 0, 0); av.scale.set(1, 0.72, 1); av.position.set(xy[0], 0.95, xy[1]); }
    else { av.rotation.set(0, 0, 0); av.scale.set(1, 1, 1); av.position.set(xy[0], 0.85, xy[1]); }
    av.material.opacity = r.xy ? 0.95 : 0.45;   // translucent when the position is unknown (1 board)
    const g = world.avGhost; g.visible = !!(showTruth && r.truth_xy && r.truth !== "away");
    if (g.visible) { g.position.set(r.truth_xy[0], r.truth === "lie" ? 0.75 : 0.85, r.truth_xy[1]); g.rotation.set(0, 0, r.truth === "lie" ? Math.PI / 2 : 0); }
    world.ring.position.set(xy[0], r.state === "lie" ? 0.52 : 0.03, xy[1]);
    spark(s.history, null);
  }
}

function spark(h, cap) {
  const c = $("spark"), ctx = c.getContext("2d"); const w = c.clientWidth, hh = c.clientHeight;
  c.width = w * devicePixelRatio; c.height = hh * devicePixelRatio; ctx.scale(devicePixelRatio, devicePixelRatio);
  ctx.clearRect(0, 0, w, hh); if (!h || h.length < 2) return;
  const vals = h.flatMap(r => [r[1], r[2]]).filter(v => v != null); const ymax = Math.max(1, ...vals) * 1.15;
  const t0 = h[0][0], t1 = h[h.length - 1][0] || 1;
  const X = t => (t - t0) / Math.max(1e-6, t1 - t0) * (w - 2) + 1, Y = v => hh - 4 - v / ymax * (hh - 10);
  ctx.strokeStyle = "rgba(255,255,255,.08)"; ctx.beginPath(); ctx.moveTo(0, Y(0)); ctx.lineTo(w, Y(0)); ctx.stroke();
  const line = (k, col) => { ctx.strokeStyle = col; ctx.lineWidth = 2; ctx.beginPath(); let f = true;
    h.forEach(r => { if (r[k] == null) return; const x = X(r[0]), y = Y(r[k]); f ? ctx.moveTo(x, y) : ctx.lineTo(x, y); f = false; }); ctx.stroke(); };
  line(2, "rgba(233,238,246,.55)"); line(1, "#4fb3ff");
}

$("bTruth").onclick = e => { showTruth = !showTruth; e.target.setAttribute("aria-pressed", showTruth); };
$("bSpin").onclick = e => { spin = !spin; controls.autoRotate = spin; e.target.setAttribute("aria-pressed", spin); };

const clock = new THREE.Clock();
function frame() {
  const t = clock.getElapsedTime();
  controls.update();
  if (world) {
    world.links.forEach(L => {
      const a = Math.min(1, Math.max(0, L.act));
      L.l.material.color.copy(COL.link0).lerp(COL.link1, a); L.l.material.opacity = 0.18 + 0.75 * a;
      L.phase = (L.phase + 0.004 + 0.02 * a) % 1; L.dot.position.lerpVectors(L.a, L.b, L.phase); L.dot.material.opacity = a > 0.25 ? 0.9 * a : 0;
    });
    if (world.avatar.visible && world.bpm) {
      const ph = Math.sin(2 * Math.PI * world.bpm / 60 * t);
      const base = world.pose === "sit" || world.pose === "still" ? 0.72 : 1;
      world.avatar.scale.set(1 + 0.04 * ph, base, 1 + 0.04 * ph);
      const rr = (t * world.bpm / 60) % 1; world.ring.scale.setScalar(1 + 2.5 * rr); world.ring.material.opacity = 0.6 * (1 - rr);
    } else if (world.ring) world.ring.material.opacity = 0;
  }
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
frame();

async function poll() {
  try { const s = await (await fetch("/state", { cache: "no-store" })).json(); if (s.scene) update(s); } catch (e) {}
  setTimeout(poll, 1000);
}
poll();
</script>
</body>
</html>
